<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>XoXo v2 draft viewport audit</title><style>body{margin:0;background:#e2e5df;color:#172e28;font:14px monospace}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#e2e5df;z-index:2}button,select{font:12px monospace;padding:8px;border:1px solid #172e28;color:inherit;background:transparent}iframe{display:block;border:0;width:390px;height:844px;margin:10px}pre{white-space:pre-wrap;margin:10px;max-width:1000px}</style></head><body><header><label>Viewport <select id="width"><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>Route <select id="route"><option value="/">UA Home</option><option value="/en/">EN Home</option><option value="/menu/">UA Menu</option><option value="/en/menu/">EN Menu</option><option value="/investors/">UA Investors</option><option value="/en/investors/">EN Investors</option></select></label><button data-section="thesis">01 Thesis</button><button data-section="product">02 Product</button><button data-section="market">03 Market</button><button data-section="economics">04 Economics</button><button data-section="scale">05 Scale</button><button data-section="terms">06 Terms</button><button data-section="contact">07 Contact</button><button id="audit">Measure layout</button></header><iframe title="Site viewport" src="/"></iframe><pre id="result">Choose a viewport and section. This is a draft-only QA surface.</pre><script>
const frame=document.querySelector('iframe'),width=document.querySelector('#width'),route=document.querySelector('#route'),result=document.querySelector('#result');width.onchange=()=>{frame.style.width=width.value+'px';frame.style.height=Number(width.value)<768?'844px':'900px';document.body.style.minWidth=(Number(width.value)+20)+'px';};route.onchange=()=>frame.src=route.value;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{const target=frame.contentDocument.getElementById(b.dataset.section);if(target){target.scrollIntoView({behavior:'instant'});result.textContent='Section '+b.dataset.section+' / viewport '+frame.contentWindow.innerWidth;}});document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;const errors=[...d.querySelectorAll('h1,h2,h3,p,dt,dd,button,label')].filter(e=>!e.closest('.gallery')&&e.getBoundingClientRect().width>0&&e.scrollWidth>e.clientWidth+2).map(e=>({tag:e.tagName,text:e.textContent.slice(0,60),client:e.clientWidth,scroll:e.scrollWidth}));result.textContent=JSON.stringify({width:w.innerWidth,height:w.innerHeight,documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,errors,images:[...d.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),sections:[...d.querySelectorAll('main>section')].map(e=>({id:e.id,height:e.getBoundingClientRect().height}))},null,2);};
</script></body></html>
